<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UP 2 Hand - ตลาดมือสองนิสิต ม.พะเยา</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      body { font-family: 'Prompt', sans-serif; }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-white/90 backdrop-blur-md border-b border-purple-100 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
        
        <a href="/" class="flex items-center gap-2 group">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-800 to-purple-600 flex items-center justify-center text-amber-400 font-black text-xl shadow-md shadow-purple-200">
            UP
          </div>
          <div class="flex flex-col">
            <span class="text-xl font-extrabold tracking-tight text-purple-900 group-hover:text-purple-700 transition">
              2 Hand
            </span>
            <span class="text-[10px] text-amber-600 font-semibold tracking-wider -mt-1 uppercase">University of Phayao</span>
          </div>
        </a>

        <!-- Desktop Search -->
        <div class="hidden md:flex flex-1 max-w-md mx-4">
          <div class="relative w-full">
            <input
              type="text"
              id="search-input"
              placeholder="ค้นหาหนังสือ, อุปกรณ์การเรียน, เสื้อผ้า..."
              class="w-full pl-10 pr-4 py-2 text-sm rounded-full border border-purple-200 focus:outline-none focus:ring-2 focus:ring-purple-600 bg-purple-50/40 transition placeholder:text-slate-400"
            />
            <svg class="w-4 h-4 text-purple-500 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <a
            href="/sell.html"
            class="flex items-center gap-1.5 bg-gradient-to-r from-purple-700 to-purple-800 hover:from-purple-800 hover:to-purple-900 text-amber-300 px-4 py-2 rounded-full font-medium text-sm shadow-sm transition"
          >
            <span class="text-lg leading-none">+</span>
            <span>ลงขายฟรี</span>
          </a>
        </div>
      </div>

      <!-- Mobile Search -->
      <div class="md:hidden px-4 pb-3">
        <div class="relative w-full">
          <input
            type="text"
            id="mobile-search-input"
            placeholder="ค้นหาของมือสอง มพ...."
            class="w-full pl-10 pr-4 py-2 text-sm rounded-full border border-purple-200 bg-purple-50/30 text-slate-800 focus:outline-none focus:ring-2 focus:ring-purple-600"
          />
          <svg class="w-4 h-4 text-purple-500 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

      <!-- Banner -->
      <div class="relative overflow-hidden rounded-2xl bg-gradient-to-r from-purple-900 via-purple-800 to-indigo-900 text-white p-6 sm:p-8 shadow-md">
        <div class="relative z-10 max-w-xl">
          <span class="inline-block bg-amber-400 text-purple-950 text-xs font-bold px-2.5 py-1 rounded-full mb-3 uppercase tracking-wide">
            UP Student Community
          </span>
          <h1 class="text-2xl sm:text-3xl font-bold tracking-tight mb-2">
            ตลาดส่งต่อของมือสอง <span class="text-amber-300">ชาว ม.พะเยา</span>
          </h1>
          <p class="text-purple-200 text-xs sm:text-sm leading-relaxed">
            ส่งต่อตำราเรียน อุปกรณ์หอพัก เสื้อผ้าราคานิสิต นัดรับสะดวกทั้งหน้ามอ หลังมอ หรือตึกเรียน
          </p>
        </div>
        <div class="absolute -right-8 -bottom-10 w-44 h-44 rounded-full bg-amber-400/20 blur-2xl"></div>
        <div class="absolute right-20 -top-8 w-40 h-40 rounded-full bg-purple-500/30 blur-xl"></div>
      </div>

      <!-- Feed Grid Header -->
      <div class="flex items-center justify-between pt-2">
        <h2 class="text-lg sm:text-xl font-bold text-slate-900">สินค้ามาใหม่ล่าสุด</h2>
        <span id="item-count" class="text-xs font-medium px-2.5 py-1 bg-purple-50 text-purple-700 border border-purple-200 rounded-full">
          กำลังโหลด...
        </span>
      </div>

      <!-- Feed Grid -->
      <div id="items-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4">
        <!-- Render cards from main.ts -->
      </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-400">
      <div class="max-w-7xl mx-auto px-4">
        <p class="font-medium text-slate-500">UP 2 Hand — ตลาดส่งต่อของนิสิต มหาวิทยาลัยพะเยา</p>
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
